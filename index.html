<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="script.js" defer></script>
        <link rel="stylesheet" href="style.css">
        <title>Payment tracker</title>
    </head>
    <body>
        <div class="content">
            <div class="logo">
                <p class="logoname">Daily Payment Tracker</p>
            </div>
            <div class="maincon">
                <div class="tpcon card">
                    <div class="svgs">
                        <svg xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 16 16">
                            <path d="M0 0h16v16H0z" fill="none" />
                            <path fill="currentColor" d="M7 14s-1 0-1-1s1-4 5-4s5 3 5 4s-1 1-1 1zm4-6a3 3 0 1 0 0-6a3 3 0 0 0 0 6m-5.784 6A2.24 2.24 0 0 1 5 13c0-1.355.68-2.75 1.936-3.72A6.3 6.3 0 0 0 5 9c-4 0-5 3-5 4s1 1 1 1zM4.5 8a2.5 2.5 0 1 0 0-5a2.5 2.5 0 0 0 0 5" />
                        </svg>
                    </div>
    
                    <div class="totalp">
                        <p class="p1">People</p>
                        <p id="participants" class="lar"></p>
                        <p class="p2">total paticipants</p>
                    </div>
                </div>
                <div class="dpcon card">
                    <div class="svgs">
                        <svg xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 640 640">
                            <path d="M0 0h640v640H0z" fill="none" />
                            <path fill="currentColor" d="M208 96c-17.7 0-32 14.3-32 32v64h-24c-13.3 0-24 10.7-24 24s10.7 24 24 24h24v32h-24c-13.3 0-24 10.7-24 24s10.7 24 24 24h24v192c0 17.7 14.3 32 32 32s32-14.3 32-32v-96h96c65.6 0 122-39.5 146.7-96H520c13.3 0 24-10.7 24-24s-10.7-24-24-24h-24.8c.5-5.3.8-10.6.8-16s-.3-10.7-.8-16H520c13.3 0 24-10.7 24-24s-10.7-24-24-24h-37.3C458 135.5 401.6 96 336 96zm199.6 96H240v-32h96c28.4 0 54 12.4 71.6 32M240 240h190.7c.9 5.2 1.3 10.5 1.3 16s-.5 10.8-1.3 16H240zm167.6 80c-17.6 19.6-43.1 32-71.6 32h-96v-32z" />
                        </svg>
                    </div>
                    <div>
                        <p >Daily payment</p>
                        <p id="Dpay" class="lar"></p>
                        <p class="p2">Per person per day</p>
                    </div>
                </div>
                <div class="startcon card">
                    <div class="svgs">
                        <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 1024 1024">
                            <path d="M0 0h1024v1024H0z" fill="none" />
                            <path fill="currentColor" fill-opacity=".15" d="M712 304c0 4.4-3.6 8-8 8h-56c-4.4 0-8-3.6-8-8v-48H384v48c0 4.4-3.6 8-8 8h-56c-4.4 0-8-3.6-8-8v-48H184v136h656V256H712z" />
                           <path fill="currentColor" d="M880 184H712v-64c0-4.4-3.6-8-8-8h-56c-4.4 0-8 3.6-8 8v64H384v-64c0-4.4-3.6-8-8-8h-56c-4.4 0-8 3.6-8 8v64H144c-17.7 0-32 14.3-32 32v664c0 17.7 14.3 32 32 32h736c17.7 0 32-14.3 32-32V216c0-17.7-14.3-32-32-32m-40 656H184V460h656zm0-448H184V256h128v48c0 4.4 3.6 8 8 8h56c4.4 0 8-3.6 8-8v-48h256v48c0 4.4 3.6 8 8 8h56c4.4 0 8-3.6 8-8v-48h128z" />
                        </svg>
                    </div>
                    <div>
                        <p>Start date</p>
                        <p id="startdate" class="lar"></p>
                        <p>Tracking from this date</p>
                    </div>
                    
                </div>
                <div class="cpcon card">
                    <div class="svgs">
                        <svg xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 24 24">
                            <path d="M0 0h24v24H0z" fill="none" />
                            <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                                <rect width="20" height="18" x="2" y="4" rx="4" />
                                <path d="M8 2v4m8-4v4M2 10h20" />
                            </g>
                        </svg>
                    </div>
                    <div>
                        <p>Today</p>
                        <p class="lar" id="today"></p>
                    </div>
                </div>
            </div>
            <div class="particon">
                <div class="j1parties">
                    <div class="profstat">
                        <div class="nameprofcon">
                            <div class="profile">
                                <p>J1</p>
                            </div>
                            <div class="name">
                                <p>Secrete 1</p>
                            </div>
                        </div>
                        <div>
                            <p id="j1-status"></p>
                        </div>
                    </div>
                    <div class="utlcon">
                        <div>
                            <p>Unpaid days</p>
                            <p id="j1unpaid" class="lar"></p>
                            <p>days</p>
                        </div>
                        <div class="tad">
                            <p>Total Amount Due</p>
                            <p id="j1balance" class="lar"></p>

                        </div>
                        <div class="lastp">
                            <p>Last payment</p>
                            <p id="jlpdate" class="lar"></p>

                        </div>

                    </div>                 
                </div>

                <div class="j1parties">
                    <div class="profstat">
                        <div class="nameprofcon">
                            <div class="profile">
                                <p>B2</p>
                            </div>
                            <div class="name">
                                <p>Secrete 2</p>
                            </div>
                        </div>
                        <div>
                            <p id="j1-status"></p>
                        </div>
                    </div>
                    <div class="utlcon">
                        <div>
                            <p>Unpaid days</p>
                            <p id="b2unpaid" class="lar"></p>
                            <p>days</p>
                        </div>
                        <div class="tad">
                            <p>Total Amount Due</p>
                            <p id="b2balance" class="lar"></p>

                        </div>
                        <div class="lastp">
                            <p>Last payment</p>
                            <p id="blpdate" class="lar"></p>
                        </div>
                    </div>                 
                </div>
            </div>
        </div>
    </body>
</html>
